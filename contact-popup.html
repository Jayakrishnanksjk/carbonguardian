<div class="modal-overlay" id="contactModal" style="display: none">
  <div class="modal-content">
    <span class="close-button" onclick="closeContactModal()">&times;</span>

    <div class="form-area">
      <form
        id="contact-form"
        action="https://formspree.io/f/mdkzbaqg"
        method="POST"
        onsubmit="return handleSubmit(event);"
      >
        <div class="input-group">
          <input name="name" type="text" placeholder="Your Name" required />
          <input name="email" type="email" placeholder="Email Address" required />
        </div>

        <input type="text" name="subject" placeholder="Select Subject" required />
        <textarea name="message" placeholder="Type Your Message" required></textarea>

        <div class="captcha-container">
          <div
            class="g-recaptcha"
            data-sitekey="6LehWnIrAAAAAMKhgWuB6GuMVp_4cZiXvCUrUvbX"
            data-callback="enableButton"
            data-expired-callback="disableButton"
          ></div>
        </div>

        <input type="hidden" name="__captcha" value="false" />

        <button id="submitBtn" class="submit-btn" disabled>
          Send Message
        </button>

        <p id="thankYouMessage" class="thank-you" style="display: none; color: green;">
          ✅ Thank you for submitting the form!
        </p>
      </form>
    </div>
  </div>
</div>
